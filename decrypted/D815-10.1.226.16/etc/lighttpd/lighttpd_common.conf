### A documentation of all available configuration options of lighttpd can be found here:
### https://redmine.lighttpd.net/projects/lighttpd/wiki/Docs_ConfigurationOptions

# The module order is relevant for some modules! Check the module documentation for dependencies when adding new modules
server.modules += ("mod_auth")
#server.modules += ("mod_setenv")  # mod_setenv must be listed before mod_redirect
server.modules += ("mod_redirect")
server.modules += ("mod_proxy")
server.modules += ("mod_openssl")
server.modules += ("mod_alias")
server.modules += ("mod_expire")

#### performance options in seconds
# server.max-keep-alive-requests = 10
# server.max-keep-alive-idle = 15
# maximum number of seconds until a waiting, non keep-alive read times out and closes the connection
server.max-read-idle = 1800
# maximum number of seconds until a waiting write call times out and closes the connection
server.max-write-idle = 1800

## number of child worker processes to spawn (0 for lightly loaded sites)
# server.max-worker = 0

## number of file descriptors (leave off for lighty loaded sites)
# server.max-fds = 512

## maximum concurrent connections the server will accept (1/2 of server.max-fds)
# server.max-connections = 256

## single client connection bandwidth limit in kilobytes (0=unlimited)
# connection.kbytes-per-second = 0

## global server bandwidth limit in kilobytes (0=unlimited)
# server.kbytes-per-second = 0

# Debug options
# debug.log-request-header = "enable"
# debug.log-request-header-on-error = "enable"
# debug.log-response-header = "enable"
# debug.log-file-not-found = "enable"
# debug.log-request-handling = "enable"
# debug.log-condition-handling = "enable"
# debug.log-condition-cache-handling = "enable"
# debug.log-ssl-noise = "enable"
# debug.log-timeouts = "enable"


server.document-root = "/snom/webui"
server.username = "www"
server.groupname = "www"
# The PhoneManager uses navigation URLs via react-router which will create 404 errors if the browser reloads the url.
# With the error-handler-404 serving index.html, the react application is reloaded and can show the right subpage.
server.error-handler-404   = "/index.html"
server.stream-response-body = 2
server.errorlog-use-syslog = "enable"
index-file.names = ("index.html")

# Run a server on port 443 with TLS encryption enabled
$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/protected/certificate2.txt"
    ssl.privkey = "/protected/privatekey2.txt"
}

# Instruct browser to cache files with the mime type text/html only for 1 hour. This ensures that the browser will ask
# the lighttpd server if the file changed and reload it (e.g. after a firmware update).
expire.mimetypes = ("text/html" => "access plus 1 hours")

# Use the grpc-web-proxy for grpc-web requests
$REQUEST_HEADER["Content-Type"] == "application/grpc-web-text" {
    proxy.server = ("" => (( "host" => "127.0.0.1", "port" => 8080 )))
    proxy.debug = 0
    proxy.header = (
        "force-http10" => "enable"
    )
}
$REQUEST_HEADER["Content-Type"] == "application/grpc-web+proto" {
    proxy.server = ("" => (( "host" => "127.0.0.1", "port" => 8080 )))
    proxy.debug = 0
    proxy.header = (
        "force-http10" => "enable"
    )
}

# Use an alias to make the translation files available.
alias.url = ("/snomlang/" => "/snom/snomlang/")

mimetype.assign = (
    ".html" => "text/html",
    ".js" => "text/javascript",
    ".css" => "text/css",
    ".png" => "image/png",
    ".jpg" => "image/jpeg"
)
