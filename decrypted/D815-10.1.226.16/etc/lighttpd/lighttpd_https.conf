include "lighttpd_common.conf"

# Run a server on port 80 which redirects connections to https
$SERVER["socket"] == ":80" {
    url.redirect = ("" => "https://${url.authority}${url.path}${qsa}")
    # We must use a temporary redirect (307) to prevent caching of the redirection which would break the SWUpdate WUI
    # in recovery mode that uses http.
    url.redirect-code = 307
}
