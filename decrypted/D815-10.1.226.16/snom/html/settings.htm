<?ssi file common9.htm?>
<script>
  function updateSetting(name, value, tag) {
    const new_value = prompt("<?lng prompt_new_value?>", value);
    if (new_value != null) {
      // We have to use a POST request to be able to change settings even if all security features including
      // use_hidden_tags and restrict_uri_queries are enabled.
      // We dynamically add a form to the settings.htm page with the required input fields and submit the form to
      // change the setting value.
      const form = document.createElement('form');
      form.setAttribute('method', 'post');

      const settingField = document.createElement('input');
      settingField.setAttribute('name', name);
      settingField.setAttribute('value', new_value);
      form.appendChild(settingField);

      const hiddenTagField = document.createElement('input');
      hiddenTagField.setAttribute('name', 'hidden_tag');
      hiddenTagField.setAttribute('value', tag);
      form.appendChild(hiddenTagField);

      const settingsApplyField = document.createElement('input');
      settingsApplyField.setAttribute('name', 'SETTINGS');
      settingsApplyField.setAttribute('value', 'apply');
      form.appendChild(settingsApplyField);

      const storeSettingsField = document.createElement('input');
      storeSettingsField.setAttribute('name', 'STORE_SETTINGS');
      storeSettingsField.setAttribute('value', 'save');
      form.appendChild(storeSettingsField);

      document.body.appendChild(form);
      form.submit();
    }
    // Return 'false' to prevent that the default context menu is shown.
    return false;
  }
</script>
</HTML>
