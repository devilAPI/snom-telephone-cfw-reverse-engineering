<div class="card">
  <h2>Boot GBA</h2>
  <p>Enter a URL to a Game Boy Advance ROM (.gba, up to 32 MiB). It's downloaded
     to RAM, run on the phone screen with gpSP, and discarded on quit.
     Keys: nav = D-pad, Fire = A, Use = B, OK = Start, Cancel = Select,
     1 = L, 3 = R, red hangup = quit.</p>
  <form method="post" action="/cgi-bin/boot-gba">
    <input type="url" name="url" placeholder="http://host/game.gba" required>
    <button type="submit" style="background:#639">Boot GBA</button>
  </form>
  <p style="margin:8px 0 0"><a href="/cgi-bin/boot-gba?log=1">Last launcher log</a></p>
</div>
