<div class="card">
  <h2>Boot Doom</h2>
  <p>Enter a URL to a Doom WAD (IWAD, e.g. Freedoom). It's downloaded to RAM,
     run on the phone screen, and discarded on quit — nothing is stored.</p>
  <form method="post" action="/cgi-bin/boot-doom">
    <input type="url" name="url" placeholder="http://host/freedoom2.wad" required>
    <button type="submit" style="background:#c33">Boot Doom</button>
  </form>
</div>
