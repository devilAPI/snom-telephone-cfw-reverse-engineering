<div class="card">
  <h2>Boot NES</h2>
  <p>Enter a URL to a NES ROM (.nes or a .zip containing one, iNES mapper 0–4). It's downloaded to RAM,
     run on the phone screen, and discarded on quit — nothing is stored.</p>
  <form method="post" action="/cgi-bin/boot-nes">
    <input type="url" name="url" placeholder="http://host/game.nes" required>
    <button type="submit" style="background:#36c">Boot NES</button>
  </form>
</div>
