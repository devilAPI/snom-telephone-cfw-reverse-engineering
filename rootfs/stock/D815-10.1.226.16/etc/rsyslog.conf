$LocalHostIPIF eth0
#  /etc/rsyslog.conf	Configuration file for rsyslog.
#
#			For more information see
#			/usr/share/doc/rsyslog-doc/html/rsyslog_conf.html
#
#  Default logging rules can be found in /etc/rsyslog.d/50-default.conf


#################
#### MODULES ####
#################

module(load="imuxsock") # provides support for local system logging

# provides UDP syslog reception
module(load="imudp")
input(type="imudp" port="514")

# provides kernel logging support and enable non-kernel klog messages
module(load="imklog" permitnonkernelfacility="on")

###########################
#### GLOBAL DIRECTIVES ####
###########################

#
# Format where the date time part can be parsed with the DateTime class
#
#template(name="FileFormat" type="string" string= "%timegenerated%.%timegenerated:21:23:date-rfc3339% %HOSTNAME% %syslogfacility-text%.%syslogpriority-text% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")
#template(name="forwardFormat" type="string" string="<%PRI%>%timegenerated%.%timegenerated:21:23:date-rfc3339% %syslogtag:1:32%%msg:::sp-if-no-1st-sp%%msg%")

#
# Format where the date time part can be taken from the phone software as string without parsing
#
template(name="FileFormat" type="string" string= "%timegenerated:::date-rfc3164%.%timegenerated:21:23:date-rfc3339% %HOSTNAME% %syslogfacility-text%.%syslogpriority-text% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")
template(name="forwardFormat" type="string" string="<%PRI%>%timegenerated:::date-rfc3164%.%timegenerated:21:23:date-rfc3339% %syslogtag:1:32%%msg:::sp-if-no-1st-sp%%msg%")

set $!ethmac=`echo $LOCAL_SYSLOG_MAC`;

if $syslogpriority-text == 'emerg' then {
  set $!level="[FATAL ]";
} else if $syslogpriority-text == 'alert' then {
  set $!level="[ALERT ]";
} else if $syslogpriority-text == 'crit' then {
  set $!level="[CRITIC]";
} else if $syslogpriority-text == 'err' then {
  set $!level="[ERROR ]";
} else if $syslogpriority-text == 'warning' then {
  set $!level="[WARN  ]";
} else if $syslogpriority-text == 'notice' then {
  set $!level="[NOTICE]";
} else if $syslogpriority-text == 'info' then {
  set $!level="[INFO  ]";
} else if $syslogpriority-text == 'debug' then {
  set $!level="[DEBUG0]";
} else {
  set $!level="[NONE  ]";
}

template(name="remoteFormat" type="string" string="<%PRI%>%timegenerated:::date-rfc3164%.%timegenerated:21:23:date-rfc3339% %fromhost-ip% %$!ethmac:::uppercase% %$!level% %syslogtag:1:32:UPPERCASE%%msg%\n")

#
# Use the template defined timestamp format.
#
$ActionFileDefaultTemplate FileFormat
$ActionForwardDefaultTemplate forwardFormat

# Filter duplicated messages
$RepeatedMsgReduction on

#
# Set the default permissions for all log files.
#
$FileOwner root
$FileGroup root
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022
$PrivDropToUser root
$PrivDropToGroup root

#
# Where to place spool and state files
#
$WorkDirectory /var/spool/rsyslog

# Forward all kind of syslog messages to local log file if environment variable LOCAL_SYSLOG_FILE is set or
# remote logging is enabled (REMOTE_SYSLOG_SERVER_TARGET is set) and eth0 interface isn't configured yet
if `echo $LOCAL_SYSLOG_FILE` != '' or $fromhost-ip == '127.0.0.1' then {
  *.*  /var/log/messages
}

if $fromhost-ip != '127.0.0.1' then {
  #Forward all kind of syslog messages to default port 514 of the remote server provided by environment variable
  if `echo $REMOTE_SYSLOG_SERVER_TARGET` != '' then {
    *.*  action(type="omfwd"
                target=`echo $REMOTE_SYSLOG_SERVER_TARGET`
                port=`echo $REMOTE_SYSLOG_SERVER_PORT`
                protocol="udp"
                action.resumeRetryCount="-1"  # infinite retries on insert failure
                queue.type="linkedList"       # data type for buffering (use asynchronous processing)
                template="remoteFormat"
                )
  }

  # Forward all kind of syslog messages to port 7999 of localhost except of lcs2 messages,
  # which are already written directly to the internal lcs2 ring buffer. This forward action
  # is configured to buffer messages as long as the client hasn't connected to this port.
  # LCS2 is listining to this port to get these messages for further log handling.
  #
  if not ($syslogtag contains "lcs2:") then {
    *.*  action(type="omfwd"
                target="127.0.0.1"
                port="7999"
                protocol="tcp"
                action.resumeRetryCount="-1"  # infinite retries on insert failure
                queue.type="linkedList"       # data type for buffering (use asynchronous processing)
                )
  }
}
