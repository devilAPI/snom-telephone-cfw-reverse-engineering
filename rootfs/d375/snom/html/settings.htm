<script>
  function updateSetting(name, value) {
    const new_value = prompt("<?lng prompt_new_value?>", value);
    if (new_value != null) {
      location.href = encodeURI("?settings=save&" + name + "=" + new_value);
    }
    return false;
  }
</script>
