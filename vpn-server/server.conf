# Minimal OpenVPN server for snom phone lab
# Run: sudo openvpn --config server.conf

port 1194
proto udp
dev tun

ca   pki/ca.crt
cert pki/server.crt
key  pki/server.key
tls-auth pki/ta.key 0

server 10.8.0.0 255.255.255.0
ifconfig-pool-persist ipp.txt

keepalive 10 120
cipher AES-256-GCM
persist-key
persist-tun

# Run as nobody after init (optional, comment out if issues)
# user nobody
# group nobody

verb 3
