[phone]
; Snom phone IP address or hostname
host = 192.168.1.100

; Web interface credentials
username = admin
password = admin

; Use HTTPS instead of HTTP (true/false)
https = false

[dialing]
; Outgoing identity (line) to use, leave empty for default
; Example: sip:1000@pbx.example.com
outgoing_uri =

; Strip characters from phone number before dialing (regex)
; Default strips spaces, dashes, parentheses
strip_chars = [\s\-\(\)]

; Prefix to add before the number (e.g. 0 for external line)
dial_prefix =

[notifications]
; Show desktop notifications (true/false)
notify = true

; Notification timeout in milliseconds
notify_timeout = 5000
